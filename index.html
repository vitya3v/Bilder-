<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет ЗП по объекту</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .object-sum-input {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .object-sum-input input {
            font-size: 18px;
            font-weight: bold;
            padding: 8px 12px;
            width: 160px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            vertical-align: top;
        }

        .worker-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 140px;
        }

        .worker-header input {
            width: 100%;
            box-sizing: border-box;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
        }

        .worker-name {
            font-weight: bold;
            font-size: 14px;
        }

        .field-label {
            font-size: 11px;
            color: #64748b;
            text-align: left;
            margin-bottom: -4px;
        }

        .date-cell {
            font-weight: 500;
            white-space: nowrap;
            width: 120px;
        }

        .work-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .work-btn.active {
            background: #22c55e;
            color: white;
            border-color: #16a34a;
        }

        .add-day-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .add-day-btn:hover {
            opacity: 0.9;
        }

        .summary-row {
            background-color: #f8fafc;
            font-weight: 500;
        }

        .summary-title {
            text-align: right;
            font-weight: bold;
            padding-right: 15px;
            background: #edf2f7;
        }

        .warning-cell {
            background-color: var(--danger-bg) !important;
            color: var(--danger-text) !important;
            font-weight: bold;
        }

        .val-highlight {
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <h2>Расчет зарплаты по объекту</h2>
        <div class="object-sum-input">
            <label for="objectSum">Сумма за объект (₽):</label>
            <input type="number" id="objectSum" value="150000" oninput="calculate()">
        </div>
    </div>

    <div class="table-wrapper">
        <table id="calcTable">
            <thead>
                <tr id="headerRow">
                    <th class="date-cell">Дата</th>
                    <!-- Динамические столбцы рабочих -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Динамические строки дат -->
            </tbody>
            <tfoot>
                <tr class="summary-row">
                    <td class="summary-title">Итого ЗП за объект</td>
                    <!-- Сумма ЗП рабочего -->
                    <td id="calcTotalContainer" colspan="100"></td>
                </tr>
                <tr class="summary-row">
                    <td class="summary-title">ЗП в день (календарные)</td>
                    <!-- ЗП / календ. дни -->
                    <td id="calcCalendarContainer" colspan="100"></td>
                </tr>
                <tr class="summary-row">
                    <td class="summary-title">ЗП в день (фактические)</td>
                    <!-- ЗП / факт. дни -->
                    <td id="calcFactContainer" colspan="100"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <button class="add-day-btn" onclick="addDay()">+ Добавить рабочий день</button>
</div>

<script>
    let workers = [
        { id: 1, name: "Игошин", coef: 1.2, minRate: 3500 },
        { id: 2, name: "Смирнов", coef: 1.0, minRate: 3000 },
        { id: 3, name: "Петров", coef: 0.8, minRate: 2500 }
    ];

    let dates = ["2026-09-25", "2026-09-26", "2026-09-27"];

    // Структура выходов: { "YYYY-MM-DD": { workerId: true/false } }
    let attendance = {
        "2026-09-25": { 1: true, 2: true, 3: true },
        "2026-09-26": { 1: true, 2: true, 3: false },
        "2026-09-27": { 1: true, 2: true, 3: true }
    };

    function initHeader() {
        const headerRow = document.getElementById("headerRow");
        headerRow.innerHTML = `<th class="date-cell">Дата</th>`;

        workers.forEach((w, index) => {
            const th = document.createElement("th");
            th.innerHTML = `
                <div class="worker-header">
                    <input type="text" class="worker-name" value="${w.name}" oninput="workers[${index}].name = this.value">
                    <span class="field-label">Коэффициент:</span>
                    <input type="number" step="0.1" value="${w.coef}" oninput="workers[${index}].coef = parseFloat(this.value) || 0; calculate();">
                    <span class="field-label">Мин. в день (₽):</span>
                    <input type="number" step="100" value="${w.minRate}" oninput="workers[${index}].minRate = parseFloat(this.value) || 0; calculate();">
                </div>
            `;
            headerRow.appendChild(th);
        });
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        dates.forEach(dateStr => {
            const tr = document.createElement("tr");
            let rowHtml = `<td class="date-cell">${formatDate(dateStr)}</td>`;

            workers.forEach(w => {
                const isWorked = attendance[dateStr] && attendance[dateStr][w.id];
                rowHtml += `
                    <td>
                        <button class="work-btn ${isWorked ? 'active' : ''}" onclick="toggleWork('${dateStr}', ${w.id})">
                            ${isWorked ? '1' : '0'}
                        </button>
                    </td>
                `;
            });

            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
        });

        calculate();
    }

    function toggleWork(dateStr, workerId) {
        if (!attendance[dateStr]) attendance[dateStr] = {};
        attendance[dateStr][workerId] = !attendance[dateStr][workerId];
        renderTable();
    }

    function addDay() {
        let lastDate = dates.length > 0 ? new Date(dates[dates.length - 1]) : new Date();
        lastDate.setDate(lastDate.getDate() + 1);
        let newDateStr = lastDate.toISOString().split('T')[0];

        dates.push(newDateStr);
        attendance[newDateStr] = {};
        workers.forEach(w => {
            attendance[newDateStr][w.id] = true;
        });

        renderTable();
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    function calculate() {
        const totalObjectSum = parseFloat(document.getElementById("objectSum").value) || 0;
        const totalCoefSum = workers.reduce((acc, w) => acc + w.coef, 0);

        // Календарные дни: разница между первой и последней датой + 1
        let calendarDays = 1;
        if (dates.length > 0) {
            const first = new Date(dates[0]);
            const last = new Date(dates[dates.length - 1]);
            const diffTime = Math.abs(last - first);
            calendarDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        }

        const totalRowHtml = [];
        const calRowHtml = [];
        const factRowHtml = [];

        workers.forEach(w => {
            // Расчет общей ЗП
            const workerSalary = totalCoefSum > 0 ? (totalObjectSum / totalCoefSum) * w.coef : 0;

            // Фактические дни
            let factDays = 0;
            dates.forEach(d => {
                if (attendance[d] && attendance[d][w.id]) factDays++;
            });

            // Расчет ставок в день
            const dailyCalendar = calendarDays > 0 ? workerSalary / calendarDays : 0;
            const dailyFact = factDays > 0 ? workerSalary / factDays : 0;

            // Проверка минималки
            const isCalWarning = dailyCalendar < w.minRate;
            const isFactWarning = dailyFact < w.minRate;

            totalRowHtml.push(`<td><span class="val-highlight">${Math.round(workerSalary).toLocaleString()} ₽</span></td>`);
            
            calRowHtml.push(`
                <td class="${isCalWarning ? 'warning-cell' : ''}">
                    ${Math.round(dailyCalendar).toLocaleString()} ₽
                </td>
            `);

            factRowHtml.push(`
                <td class="${isFactWarning ? 'warning-cell' : ''}">
                    ${Math.round(dailyFact).toLocaleString()} ₽ <br><small>(${factDays} дн.)</small>
                </td>
            `);
        });

        document.getElementById("calcTotalContainer").outerHTML = totalRowHtml.join('');
        document.getElementById("calcCalendarContainer").outerHTML = calRowHtml.join('');
        document.getElementById("calcFactContainer").outerHTML = factRowHtml.join('');
    }

    // Инициализация
    initHeader();
    renderTable();
</script>

</body>
</html>
